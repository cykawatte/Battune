name: Native macOS validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          swift --version
      - run: ./scripts/lint.sh
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: ./scripts/build.sh release universal
      - name: Xcode wrapper
        run: xcodebuild -project Battune.xcodeproj -scheme Battune -configuration Debug -derivedDataPath build/Xcode CODE_SIGNING_ALLOWED=NO build
