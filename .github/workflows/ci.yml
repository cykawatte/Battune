name: Native macOS validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          swift --version
      - run: ./scripts/lint.sh
      - run: ./scripts/test.sh
      - run: ./scripts/build.sh
      - run: ./scripts/build.sh release universal
      - run: ./scripts/package.sh
      - run: ./scripts/verify-package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Battune-beta-${{ github.sha }}
          path: |
            build/packages/*.pkg
            build/packages/*.zip
            build/packages/SHA256SUMS.txt
          if-no-files-found: error
      - name: Xcode wrapper
        run: xcodebuild -project Battune.xcodeproj -scheme Battune -configuration Debug -derivedDataPath build/Xcode CODE_SIGNING_ALLOWED=NO build
